##
## docker-compose.ssl.yml
## Extend docker-compose.yml untuk produksi dengan SSL (Let's Encrypt via Certbot)
## Jalankan dengan: docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
##

services:
  # Override app: port 8080 tidak dipublish ke publik (hanya diakses proxy internal)
  app:
    ports: !reset []
    networks:
      - internal

  # Reverse proxy Nginx yang menangani SSL termination
  proxy:
    image: nginx:alpine
    container_name: hadirform-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

  # Certbot untuk mendapatkan dan memperbarui sertifikat Let's Encrypt
  certbot:
    image: certbot/certbot:latest
    container_name: hadirform-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Certbot tidak berjalan terus-menerus; jalankan manual atau via cron
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait; certbot renew --webroot -w /var/www/certbot --quiet; done"

  db:
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  certbot_www:
  certbot_certs:
